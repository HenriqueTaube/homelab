datadir=/mnt/knots/.bitcoin
txindex=1
daemon=1
dbcache=2048
maxconnections=40

# rpcuser/rpcpassword (instead of cookie auth) so the mempool backend, which
# runs off-VM, can authenticate over the network — cookie files aren't
# network-shareable. This disables Bitcoin Core's automatic .cookie file, so
# electrs must be given the same credentials via its "auth" config key
# (see config.toml).
server=1
rpcuser=user
rpcpassword=password
rpcallowip=192.168.1.0/24
rpcbind=0.0.0.0:8332

zmqpubrawblock=tcp://0.0.0.0:28332
zmqpubrawtx=tcp://0.0.0.0:28333
